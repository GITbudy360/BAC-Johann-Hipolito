apiVersion: v1
kind: Service
metadata:
  name: fastapi-leaderboard-svc
  namespace: fastapi-leaderboard
spec:
  type: NodePort
  selector:
    app: fastapi-leaderboard 
  ports:
    - name: http # Ensure this matches the port name in your FastAPI ServiceMonitor manifest
      port: 8000
      targetPort: 8000