apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-leaderboard
  namespace: fastapi-leaderboard
spec:
  strategy:
    type: Recreate
  replicas: 3
  selector:
    matchLabels:
      app: fastapi-leaderboard
  template:
    metadata:
      labels:
        app: fastapi-leaderboard
    spec:
      # This points to the secret created in Step 3
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: fastapi
        image: ghcr.io/gitbudy360/fastapi-leaderboard:v1.28
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-master-leader.redis-cluster.svc.cluster.local"
        resources:
          requests:
            cpu: "500m"       
            memory: "512Mi"   
          limits:
            cpu: "1000m"      
            memory: "1Gi"     
      affinity:
      # ensure that the FastAPI pods are scheduled on different nodes than the Redis pods to avoid resource contention.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fastapi-leaderboard
            topologyKey: "kubernetes.io/hostname"