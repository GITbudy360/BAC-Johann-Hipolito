apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-leaderboard
  namespace: fastapi-leaderboard
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: 3
  selector:
    matchLabels:
      app: fastapi-leaderboard
  template:
    metadata:
      labels:
        app: fastapi-leaderboard
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: fastapi
        image: ghcr.io/gitbudy360/fastapi-leaderboard:v1.31
        command: ["uvicorn"]
        # Allows FastAPI to process the scatter-gather fan-out concurrently and highly efficiently
        args: ["main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--loop", "uvloop"]
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-master-leader.redis-cluster.svc.cluster.local"
        resources:
          requests:
            cpu: "250m"       
            memory: "256Mi"   
          limits:
            cpu: "500m"      
            memory: "512Mi"     
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fastapi-leaderboard
            topologyKey: "kubernetes.io/hostname"