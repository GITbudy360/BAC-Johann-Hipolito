apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-reactive-scaler
  namespace: redis-cluster
spec:
  scaleTargetRef:
    apiVersion: redis.redis.opstreelabs.in/v1beta2
    kind: RedisCluster
    name: redis-master 
  minReplicaCount: 3
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 1
            periodSeconds: 180
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
      metricName: http-request-rate
      threshold: "65"
      query: sum(rate(http_request_duration_seconds_count{namespace="fastapi-leaderboard"}[2m]))