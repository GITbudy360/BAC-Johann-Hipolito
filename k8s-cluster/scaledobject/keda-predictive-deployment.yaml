apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-predictive-scaler
  namespace: redis-cluster
spec:
  scaleTargetRef:
    apiVersion: redis.redis.opstreelabs.in/v1beta2
    kind: RedisCluster
    name: redis-master
  minReplicaCount: 3
  maxReplicaCount: 6
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          policies:
          - type: Pods
          # Ensures that the HPA will not scale up more than 1 pod at a time. This prevents the "thundering herd" problem where multiple pods are added at once, which can lead to resource contention and instability in the Redis cluster.
            value: 1
            periodSeconds: 60
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
      # The metricName and query below are used to scale the Redis cluster predictively based on the number of HTTP requests received by the FastAPI leaderboard application.
      metricName: predicted_http_requests
      threshold: "150"
      query: predict_linear(sum(rate(http_request_duration_seconds_count{namespace="fastapi-leaderboard"}[2m]))[5m:15s], 120)