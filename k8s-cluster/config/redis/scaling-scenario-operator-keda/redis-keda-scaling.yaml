apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-keda-scaler
  namespace: redis
spec:
  # Crucial: Target the Operator's Custom Resource, NOT the StatefulSet
  scaleTargetRef:
    apiVersion: redis.redis.opstreelabs.in/v1beta2
    kind: RedisCluster
    name: redis-cluster
  minReplicaCount: 3
  maxReplicaCount: 6
  advanced:
    restoreToOriginalReplicaCount: true
  fallback:
    failureThreshold: 3
    replicas: 4
  triggers:
    - type: prometheus
      # Value (not the KEDA default AverageValue): with AverageValue the threshold is
      # interpreted PER REPLICA, so the measured ~0.10 ratio vs a 0.05 threshold would give
      # desired=ceil(0.10/0.05)=2 and never scale past minReplicaCount. With Value,
      # desired=ceil(currentReplicas * ratio/threshold), so it fires (and climbs toward
      # maxReplicaCount) whenever the ratio exceeds the threshold.
      metricType: Value
      metadata:
        # Update this to match your actual internal Prometheus Service URL
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # Cache-miss ratio. The realized ratio under load is ~0.10 (writes populate the warm
        # boards, so most warm reads hit), so the original 0.15 never fired. 0.05 sits safely
        # below the measured ~0.10, so scale-out actually triggers.
        query: |
          sum(rate(redis_keyspace_misses_total{namespace="redis"}[1m]))
          /
          (sum(rate(redis_keyspace_hits_total{namespace="redis"}[1m])) + sum(rate(redis_keyspace_misses_total{namespace="redis"}[1m])))
        threshold: "0.05"