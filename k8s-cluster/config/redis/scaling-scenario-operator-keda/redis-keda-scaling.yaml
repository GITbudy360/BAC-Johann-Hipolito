apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-keda-scaler
  namespace: redis
spec:
  # Crucial: Target the Operator's Custom Resource, NOT the StatefulSet
  scaleTargetRef:
    apiVersion: redis.redis.opstreelabs.in/v1beta2
    kind: RedisCluster
    name: redis-cluster
  minReplicaCount: 3
  maxReplicaCount: 6
  advanced:
    restoreToOriginalReplicaCount: true
  fallback:
    failureThreshold: 3
    replicas: 4
  triggers:
    - type: prometheus
      # Value (not the KEDA default AverageValue): with AverageValue the threshold is
      # interpreted PER REPLICA, so a cache-miss RATIO of ~0.25 vs threshold 0.15 would
      # compute desired=ceil(0.25/0.15)=2 and never scale past minReplicaCount. With
      # Value, desired=ceil(currentReplicas * ratio/threshold), so it fires when the
      # ratio exceeds the threshold as intended.
      metricType: Value
      metadata:
        # Update this to match your actual internal Prometheus Service URL
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # Tracks the Cache Miss Ratio. Triggers scale out if misses exceed 15% of total requests.
        query: |
          sum(rate(redis_keyspace_misses_total{namespace="redis"}[1m])) 
          / 
          (sum(rate(redis_keyspace_hits_total{namespace="redis"}[1m])) + sum(rate(redis_keyspace_misses_total{namespace="redis"}[1m])))
        threshold: "0.15"