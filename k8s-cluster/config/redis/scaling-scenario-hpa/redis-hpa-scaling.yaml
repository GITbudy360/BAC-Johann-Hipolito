apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-hpa
  namespace: redis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redis
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: ContainerResource # Changed from Resource
      containerResource:
        name: cpu
        container: redis # Targets only the main application
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
      scaleDown:
        # Forces the HPA to wait 5 minutes after CPU drops before terminating a pod
        stabilizationWindowSeconds: 300
        policies:
        - type: Pods
          value: 1
          periodSeconds: 60 # Only kill 1 pod per minute maximum
      scaleUp:
        # Matched IDENTICALLY on the KEDA ScaledObject so autoscaler dynamics are a constant,
        # not a variable, between the two scenarios. One pod at a time, 180s apart. (Harmless
        # here - ghosts just appear one-by-one - but on the operator side it lets each reshard
        # finish before the next node is added, removing the flapping confound.)
        stabilizationWindowSeconds: 0
        policies:
        - type: Pods
          value: 1
          periodSeconds: 180