apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-hpa
  namespace: redis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redis
  # Baseline is 6 pods (3 masters + 3 replicas, see redis-hpa-cluster.yaml). minReplicas MUST
  # equal that baseline, else the HPA would scale the StatefulSet down to 3 while idle and strip
  # the replicas before the test. maxReplicas leaves room for the HPA to add Ghost Pods
  # (redis-6/7/8) under load. NOTE: unlike KEDA's maxReplicaCount (which counts MASTERS only),
  # this counts ALL pods incl. replicas + ghosts, so the raw numbers are NOT directly comparable
  # across scenarios - a documented, intentional asymmetry; the matched part is the behavior block.
  minReplicas: 6
  maxReplicas: 9
  metrics:
    - type: ContainerResource # Changed from Resource
      containerResource:
        name: cpu
        container: redis # Targets only the main application
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
      scaleDown:
        # Forces the HPA to wait 5 minutes after CPU drops before terminating a pod
        stabilizationWindowSeconds: 300
        policies:
        - type: Pods
          value: 1
          periodSeconds: 60 # Only kill 1 pod per minute maximum
      scaleUp:
        # Matched IDENTICALLY on the KEDA ScaledObject so autoscaler dynamics are a constant,
        # not a variable, between the two scenarios. One pod at a time, 180s apart. (Harmless
        # here - ghosts just appear one-by-one - but on the operator side it lets each reshard
        # finish before the next node is added, removing the flapping confound.)
        stabilizationWindowSeconds: 0
        policies:
        - type: Pods
          value: 1
          periodSeconds: 180