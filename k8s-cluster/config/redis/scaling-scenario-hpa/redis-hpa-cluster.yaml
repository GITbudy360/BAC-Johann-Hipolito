apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-min-config
  namespace: redis
data:
  redis.conf: |
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    appendonly no
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels:
    app: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      name: redis
    - port: 16379
      name: gossip
    - port: 9121
      name: metrics
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  # 6 pods = 3 masters + 3 replicas. The master/replica ROLES are assigned at runtime by the
  # setup script's `redis-cli --cluster create --cluster-replicas 1` - a vanilla StatefulSet
  # cannot express "pod X replicates pod Y", which is exactly the topology gap the operator
  # closes declaratively. The HPA's minReplicas is pinned to 6 (see redis-hpa-scaling.yaml) so
  # it won't scale the StatefulSet down to 3 while idle and strip the replicas before the test.
  replicas: 6
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          resources:
            ## Base requests are strictly required for HPA to calculate usage percentages
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: conf
              mountPath: /etc/redis
        - name: redis-exporter
          image: ghcr.io/oliver006/redis_exporter:latest
          ports:
          - containerPort: 9121
            name: metrics
          env:
          # Since it's a sidecar, it can reach the main Redis container via localhost
          - name: REDIS_ADDR
            value: "redis://localhost:6379"
          resources: 
            requests:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: conf
          configMap:
            name: redis-min-config